name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.editor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [vim, nvim]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y vim neovim universal-ctags global

      - name: Run tests
        run: test/run.sh ${{ matrix.editor }}
